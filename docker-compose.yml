# =====================================================================
# MÔI TRƯỜNG PHÁT TRIỂN CỤC BỘ - chạy toàn bộ hệ thống bằng 1 lệnh:
#     cp .env.example .env && docker compose up -d --build
# Web: http://localhost  |  Swagger: http://localhost/api/v1/docs/  |  MinIO: http://localhost:9001
# =====================================================================
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - ./backend:/app
    - tmp_uploads:/app/tmp_uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend-net]
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [backend-net]
    restart: unless-stopped

  backend:
    <<: *backend
    # runserver dùng Daphne (ASGI) và tự reload khi sửa code
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    # -B: chạy kèm Celery Beat (lịch dọn tệp tạm) - chỉ dùng ở dev
    command: celery -A config worker -B -l info --concurrency=2
    healthcheck:
      disable: true

  db:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --ngram-token-size=2 --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports: ["3306:3306"]   # để DBeaver / TablePlus kết nối khi phát triển
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend-net]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    networks: [backend-net]
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 2; done;
      mc mb -p local/$${S3_BUCKET};
      mc anonymous set download local/$${S3_BUCKET};
      echo 'Bucket sẵn sàng';"
    env_file: .env
    networks: [backend-net]
    restart: "no"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [backend-net]
    restart: unless-stopped

networks:
  backend-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  tmp_uploads:
  frontend_node_modules:
