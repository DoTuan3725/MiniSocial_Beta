# =====================================================================
# PRODUCTION trên VPS Ubuntu (sau Cloudflare). Frontend nằm ở Cloudflare Pages,
# media ở Cloudflare R2 -> VPS chỉ chạy: nginx, backend, worker, beat, db, redis, db-backup.
# Chỉ Nginx mở cổng 80/443 ra ngoài; các container khác nằm trong mạng backend-net khép kín.
#     docker compose -f docker-compose.prod.yml up -d
# Rollback:  IMAGE_TAG=<sha-cũ> docker compose -f docker-compose.prod.yml up -d --no-deps backend worker beat
# =====================================================================
x-app: &app
  image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  volumes:
    - tmp_uploads:/app/tmp_uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend-net]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [backend-net]
    restart: unless-stopped
    logging: *logging

  backend:
    <<: *app
    command: daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency=2
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  db:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --ngram-token-size=2 --innodb-buffer-pool-size=1G
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend-net]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    # volatile-lru: chỉ thu hồi key có TTL (cache, presence) khi đầy RAM, không đụng hàng đợi Celery
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend-net]
    restart: unless-stopped
    logging: *logging

  db-backup:
    image: mysql:8.0
    entrypoint: ["/bin/bash", "/scripts/backup_loop.sh"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend-net]
    restart: unless-stopped
    logging: *logging

networks:
  backend-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  tmp_uploads:
